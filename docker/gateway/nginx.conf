# Minimal stand-in for Supabase's Kong gateway.
#
# supabase-js builds its auth endpoint as `${SUPABASE_URL}/auth/v1/...`, so a
# bare GoTrue on :9999 is not directly usable by the client library. This maps
# that path prefix onto GoTrue, which lets the web app use the real
# @supabase/supabase-js against the local stack with no special-casing.
#
# Hosted Supabase also routes /rest/v1 (PostgREST), /storage/v1 and
# /realtime/v1 here. This project talks to its own Express API instead of
# PostgREST, so only auth is proxied.

map $http_origin $cors_origin {
    default            "";
    "http://localhost:3000"  $http_origin;
    "http://127.0.0.1:3000"  $http_origin;
}

server {
    listen 8000;
    server_name _;

    # Uploads are handled by presigned R2 URLs, not this gateway.
    client_max_body_size 1m;

    location /auth/v1/ {
        # ------------------------------------------------------------------
        # CORS
        # ------------------------------------------------------------------
        # The browser calls this origin (:8000) from the web app (:3000), so
        # every auth request is cross-origin and preflighted. Kong supplies
        # these headers on hosted Supabase; without them here the login and
        # signup forms fail with an opaque "Failed to fetch".
        #
        # Origin is echoed from an allow-list rather than `*` because the
        # responses set credentials — `*` is invalid with
        # Allow-Credentials: true, and browsers reject the pair.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            # supabase-js sends apikey and x-client-info on every call; omitting
            # either from this list fails the preflight.
            add_header Access-Control-Allow-Headers     "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept-profile, content-profile" always;
            add_header Access-Control-Max-Age           3600 always;
            add_header Content-Length                   0;
            return 204;
        }

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers    "content-range, x-supabase-api-version" always;

        # GoTrue emits its own permissive CORS headers; dropping them prevents
        # duplicate Access-Control-Allow-Origin values, which browsers treat as
        # a failure rather than picking one.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_pass http://auth:9999/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OAuth flows redirect through here; do not rewrite Location headers.
        proxy_redirect off;
    }

    location = /health {
        access_log off;
        return 200 'gateway ok\n';
        add_header Content-Type text/plain;
    }
}
